# tauri shell around the next.js static export
[package]
name = "tgai-desktop"
version = "3.0.0"
description = "ai userbot for your own telegram account"
edition = "2021"

[lib]
name = "tgai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
