[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgai"
version = "3.0.0"
description = "ai userbot for your own telegram account"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "telethon>=1.24.0,<2.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[project.scripts]
tgai = "tgai.app:main"

[tool.setuptools.packages.find]
include = ["tgai*"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "desktop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# fastapi's dependency injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
